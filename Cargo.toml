[workspace]
members = ["libratgreet", "ratgreet", "tests"]
# `tests` turns on ratgreet's `test-harness` feature; building it by default
# would unify that feature into the greeter binary (see ratgreet/src/main.rs).
default-members = ["libratgreet", "ratgreet"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"

[workspace.dependencies]
jiff = "1"
greetd_ipc = { version = "0.10", features = ["tokio-codec"] }
ratatui = { version = "0.30", default-features = false, features = [
  "crossterm",
  "unstable",
] }
rustix = { version = "1", features = ["system"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }
tracing = "0.1"
tracing-appender = "0.2"
